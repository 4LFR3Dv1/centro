name: Refresh transit data

on:
  workflow_dispatch:
  schedule:
    - cron: '27 11 * * *'
  push:
    branches:
      - main
      - feat/transit-overlay-manager
    paths:
      - 'scripts/refresh-transit-data.mjs'
      - '.github/workflows/refresh-transit-data.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize São José transit snapshot
        run: node scripts/refresh-transit-data.mjs --strict
      - name: Validate snapshot
        run: node scripts/refresh-transit-data.mjs --validate-existing
      - name: Persist snapshot when source changed
        run: |
          FILES="public/data/maps/sjc-transit.geojson public/data/maps/sjc-transit-manifest.json src/generated/transit-intelligence.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No transit source change detected."
            exit 0
          fi
          git config user.name "centro-transit-data"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git commit -m "data: refresh São José transit snapshot"
          git push origin HEAD:${{ github.ref_name }}
