name: Overlay build check

on:
  push:
    branches:
      - fix/overlay-render-lifecycle
    paths:
      - 'src/home-map.ts'
      - '.github/workflows/overlay-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript + Vite
        run: npm run build:app
