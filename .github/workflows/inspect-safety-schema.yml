name: Inspect safety schema

on:
  push:
    branches: [feat/traffic-safety-layer]
    paths:
      - 'scripts/inspect-safety-schema.mjs'
      - '.github/workflows/inspect-safety-schema.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/inspect-safety-schema.mjs
