name: Inspect transit OSM

on:
  workflow_dispatch:
  push:
    branches:
      - feat/transit-overlay-manager
    paths:
      - 'scripts/inspect-transit-osm.mjs'
      - '.github/workflows/inspect-transit-osm.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/inspect-transit-osm.mjs
