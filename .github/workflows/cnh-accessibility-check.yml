name: CNH accessibility check

on:
  push:
    branches:
      - feat/cnh-accessibility-002
    paths:
      - 'public/cnh-journey.js'
      - 'public/cnh-journey.css'
      - '.github/workflows/cnh-accessibility-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate public CNH journey
        run: node --check public/cnh-journey.js
      - name: TypeScript + Vite
        run: npm run build:app
