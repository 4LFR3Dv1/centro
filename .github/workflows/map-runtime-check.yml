name: Map runtime check

on:
  push:
    branches:
      - fix/map-readiness-school
    paths:
      - 'src/home-map-v2.ts'
      - 'src/main.tsx'
      - '.github/workflows/map-runtime-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript + Vite
        run: npm run build:app
