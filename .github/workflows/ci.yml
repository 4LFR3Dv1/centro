name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Ingest official Detran-SP data
        run: npm run data:ingest -- --strict

      - name: Build
        run: npm run build:app

      - name: Build deployment image
        run: docker build -t centro:r3c .
