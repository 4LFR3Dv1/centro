name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: centro
          POSTGRES_PASSWORD: centro
          POSTGRES_DB: centro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centro -d centro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://centro:centro@127.0.0.1:5432/centro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Apply operational migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Validate operational constitution
        run: npm run ops:check

      - name: Validate public CNH resolver
        run: |
          node --check public/cnh-journey.js
          node --check public/cnh-resolver-shell.js

      - name: Ingest official Detran-SP data
        run: npm run data:ingest -- --strict

      - name: Validate persisted map snapshot
        run: npm run map:data:validate

      - name: Validate persisted safety snapshot
        run: npm run safety:data:validate

      - name: Validate persisted transit snapshot
        run: npm run transit:data:validate

      - name: Build frontend and server
        run: |
          npm run build:app
          npm run build:server

      - name: Build deployment image
        run: docker build -t centro:exams-001 .

      - name: Smoke production runtime
        run: |
          docker run -d --name centro-runtime-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=18080 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e CENTRO_PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            centro:exams-001
          trap 'docker rm -f centro-runtime-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if [ "$attempt" = "20" ]; then
              docker logs centro-runtime-smoke
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/admin >/dev/null
          curl -fsS http://127.0.0.1:18080/admin/hoje >/dev/null
          curl -fsS http://127.0.0.1:18080/admin/alunos >/dev/null
          curl -fsS http://127.0.0.1:18080/admin/agenda >/dev/null
          curl -fsS http://127.0.0.1:18080/admin/exames >/dev/null
          curl -fsS http://127.0.0.1:18080/admin/seguranca >/dev/null
          curl -fsS http://127.0.0.1:18080/aluno >/dev/null
          curl -fsS http://127.0.0.1:18080/aluno/agenda >/dev/null
          curl -fsS http://127.0.0.1:18080/aluno/processo >/dev/null
          curl -fsS http://127.0.0.1:18080/aluno/guia >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/auth/session)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/today)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/security)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/students)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/schedule/options)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/exams)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/process/enrollments/00000000-0000-4000-8000-000000000000)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/api/admin/guides?studentId=00000000-0000-4000-8000-000000000000')" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/student/auth/session)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/student/calendar)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/student/process)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/student/guides)" = "401"
